owner: BODAPATI88
repo: status

# Checked every 5 minutes by GitHub Actions. A failure opens an issue in this
# repo (GitHub emails the owner); recovery closes it.
sites:
  - name: bvrinfra.in
    url: https://bvrinfra.in
  - name: www.bvrinfra.in
    url: https://www.bvrinfra.in
  - name: Projects page
    url: https://bvrinfra.in/projects/

status-website:
  cname: status.bvrinfra.in
  logoUrl: https://bvrinfra.in/favicon.svg
  name: bvrinfra status
  introTitle: "Is bvrinfra.in up?"
  introMessage: Checked every five minutes from GitHub Actions. Incidents open automatically as issues in [the status repository](https://github.com/BODAPATI88/status). This monitor runs on no server of mine, so it keeps working when my homelab doesn't.
  navbar:
    - title: Status
      href: /
    - title: bvrinfra.in
      href: https://bvrinfra.in
    - title: Source
      href: https://github.com/$OWNER/$REPO

# Configuration reference: https://upptime.js.org/docs/configuration
# Secret required: GH_PAT (fine-grained, this repo only). Rolling it: bvrinfra docs/runbooks/dns-terraform.md
